name: Lint

# Mirrors the Node-version matrix + action versions used in
# `Frontend-index/.github/workflows/ci.yml` and
# `Frontend-auth/.github/workflows/ci.yml`. Differences:
#
#   - Docs has no application to build, test, or e2e — only Markdown
#     validation. So the workflow is one job: install, audit, then the
#     lint + link checks.
#
#   - No private registry config needed: this repo uses only public
#     npm deps (the fleet's private `@nimbusnexus/*` deps live in
#     Nexus, not used here).
#
#   - Same `24.15.0` floor + `current` canary pattern as the other
#     frontends — gives early warning on upstream tooling breakage
#     (markdownlint, gray-matter, lychee) before we bump the floor.
#
# `name: Lint` ON LINE 1 IS FREE TO CHANGE TODAY, and this note exists to say so precisely, because
# the obvious assumption is the opposite. Nothing server-side depends on it:
# `gh api repos/NimbusNexus/docs/branches/main/protection` returns 404 "Branch not protected"
# (checked 2026-09-05), so there is no required status check — and a required check would name the
# JOB (`lint (24.15.0, true)`) rather than this workflow in any case.
#
# ⚠ THE THING THAT WOULD MAKE IT LOAD-BEARING is a release gate that asks "did CI pass on the branch
# head" before cutting anything, because the only handle the Actions API gives such a gate is the
# workflow NAME. This repo has no such gate on `main` today. If one is added, it resolves this
# workflow by name and the two move in the SAME commit — the estate's rails spell that setting
# `CI_WORKFLOW`, and it would have to read `Lint`, not the estate's usual `CI`, because this
# workflow lints Markdown and runs no tests.
#
# THE `push:` TRIGGER BELOW IS WHAT MAKES THAT POSSIBLE AT ALL. A branch-head gate needs a run
# against the merge commit, which is a SHA no pull_request run ever tested. A repo that lints only
# on `pull_request` has no green branch head to point at, so keep both triggers.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    # ─── Node version matrix ──────────────────────────────────────────
    # Same pattern as Frontend-auth / Frontend-index: pinned floor as
    # the required leg, `current` as a canary that surfaces upcoming
    # tooling breakage without blocking merges.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24.15.0", "current"]
        include:
          - node-version: "24.15.0"
            required: true
          - node-version: "current"
            required: false
    continue-on-error: ${{ !matrix.required }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit dependencies
        # Fail on high/critical advisories. `--omit=dev` keeps dev-only
        # tooling vulns out of the gate so a markdownlint CVE doesn't
        # block a typo-fix PR.
        #
        # "no dependabot config" USED TO BE THE REST OF THIS SENTENCE
        # and is no longer true — .github/dependabot.yml has existed
        # since ebeb049. The substance survives the correction, which
        # is why the `--omit=dev` choice stands: that config runs a
        # github-actions lane ONLY, and says so deliberately. So there
        # is still nothing else watching this repo's dev dependencies,
        # and skipping them here is an accepted risk on a docs-only
        # repo rather than a gap something downstream covers.
        # ⚠ MUST FAIL ON FINDINGS, NOT ON npm BEING UNREACHABLE. On 2026-09-04 npm's advisory
        # service was down for hours — the registry was fine (installs worked, package fetches
        # returned 200 in a second) but POSTs to /-/npm/v1/security/advisories/bulk accepted the
        # connection and never answered, while a GET on the same path returned 405 in 0.27s.
        # Healthy gateway, dead backend, and npm's status page said "All Systems Operational"
        # throughout because it monitors the registry, not advisory lookup. Four repos' merges were
        # blocked by it, this one among them, each run burning five minutes timing out first.
        #
        # A gate that fails that way buys NO security: a hang and a clean audit are
        # indistinguishable to it, so what it enforces is "npm answered".
        #
        # THE EXIT CODE CANNOT TELL THE TWO APART — npm exits 1 for both — hence the message match.
        # Anything unrecognised STILL FAILS, and the warning says SKIPPED rather than passed so a
        # green run is never read as a clean audit. One retry first, because the outage flapped.
        #
        # The shared rail (gh-workflows ci-node-nexus.yml) owns this for repos that call it; this
        # workflow is bespoke, so it carries its own copy. Keep the two in step.
        run: |
          run_audit() { npm audit --omit=dev --audit-level=high 2>&1; }
          out=$(run_audit) && rc=0 || rc=$?
          if [ "$rc" -ne 0 ]; then
            sleep 15
            out=$(run_audit) && rc=0 || rc=$?
          fi
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            if printf '%s' "$out" | grep -qiE 'audit endpoint returned an error|Service Unavailable|network timeout|ENOTFOUND|ETIMEDOUT|ECONNRESET|EAI_AGAIN|socket hang up'; then
              echo "::warning::npm audit could not reach npm's advisory service — the vulnerability check was SKIPPED for this run, not passed."
            else
              exit "$rc"
            fi
          fi

      - name: Markdown lint
        run: npm run lint:markdown

      - name: Frontmatter validation
        run: npm run lint:frontmatter

      - name: Placeholder validation
        run: npm run lint:placeholders

      - name: Template-marker validation
        # Rejects committed pages that still carry the leftover
        # `<!-- TEMPLATE — copy this file ... -->` block from
        # content/_templates/*. Catches "copy-paste, forget to delete
        # the marker" before it ships to the rendered docs.
        run: npm run lint:templates

      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          # Lychee config:
          #
          # --base https://nimbusnexus.net
          #   Gives lychee a host so root-relative paths like
          #   /docs/api/vms parse as URLs. Without this, lychee errors
          #   ("Cannot convert path '/docs/...' to a URI") BEFORE any
          #   --exclude pattern is applied — so excludes that target
          #   /docs/ never get a chance to fire.
          #
          # --exclude '^https?://(www\.)?nimbusnexus\.net'
          #   Skip our own domain. Internal cross-references (/docs/*,
          #   /resources/*, /contact/*) are validated by the frontend's
          #   render path via the docs manifest — that's the
          #   authoritative check. Re-checking via HTTP from here just
          #   races deploys: a docs PR can legitimately add a link to a
          #   page that won't exist until the same PR ships.
          #
          # --exclude '\{\{[A-Z_]+\}\}'
          #   Skip placeholder URLs like `{{API_BASE_URL}}/v1/vms`.
          #   These are interpolated at render time by
          #   `docsPlaceholders.ts` in the frontend; in the raw .md
          #   they're literal strings that lychee can't and shouldn't
          #   resolve.
          #
          # --exclude '^https?://(www\.)?npmjs\.com'
          #   npmjs.com sits behind bot protection and answers 403 to any
          #   automated request — including with a browser User-Agent — so
          #   a perfectly good package page is unverifiable from CI and
          #   fails the run. Excluded rather than dropped, because the link
          #   is the one a reader actually wants. Package existence is
          #   still checkable by hand against registry.npmjs.org, which
          #   does answer 200.
          #
          # Everything else (github.com, pypi.org, creativecommons.org,
          # etc.) is checked — that's where this step earns its keep,
          # catching bit-rot on third-party links.
          args: >-
            --no-progress
            --base https://nimbusnexus.net
            --exclude '^https?://(www\.)?nimbusnexus\.net'
            --exclude '^https?://(www\.)?npmjs\.com'
            --exclude '\{\{[A-Z_]+\}\}'
            'content/**/*.md'
          fail: true
